name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            architecture: x86_64
            cc: gcc
            cxx: g++
          - runner: macos-15
            platform: macos-arm64
            architecture: arm64
            cc: clang
            cxx: clang++

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev qt6-tools-dev-tools

      - name: Install macOS Qt dependencies
        if: runner.os == 'macOS'
        run: brew install qt

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DLINCUPL_BUILD_GUI=ON

      - name: Build
        run: cmake --build build --parallel 3

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify executables
        shell: bash
        run: |
          set -euo pipefail
          for tool in cupl csim cbld backpin cfitr jedinspect jedcompare fit1502 fit1504 fit1508 lincupl linsim; do
            test -x "build/bin/$tool"
          done

      - name: Package
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="git-${GITHUB_SHA:0:12}"
          fi
          version="${version//\//-}"
          package="lincupl-${version}-${PACKAGE_PLATFORM}"
          cmake --install build --prefix "$PWD/package/$package"
          cp README.md LICENSE wincupl-extract-data "package/$package/"
          mkdir -p "package/$package/licenses" dist
          cp third_party/espresso/COPYRIGHT "package/$package/licenses/espresso-COPYRIGHT"
          tar -C package -czf "dist/$package.tar.gz" "$package"
          tar -tzf "dist/$package.tar.gz"

      - name: Upload binary archive
        uses: actions/upload-artifact@v7
        with:
          name: lincupl-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  regression:
    name: Full regressions (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            cc: gcc
          - runner: macos-15
            platform: macos-arm64
            cc: clang

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download and verify device data
        run: ./wincupl-extract-data

      - name: Install EDIF integration test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys iverilog

      - name: Configure full regression build
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DLINCUPL_BUILD_GUI=OFF
          -DLINCUPL_REQUIRE_TEST_DATA=ON

      - name: Build
        run: cmake --build build --parallel 3

      - name: Run full regressions
        run: ctest --test-dir build --output-on-failure --no-tests=error

  windows:
    name: windows-x86_64 (MSVC)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Qt for MSVC
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt" --archives qtbase qttools qtsvg
          $qt = "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64"
          "QT_ROOT=$qt" >> $env:GITHUB_ENV
          "$qt/bin" >> $env:GITHUB_PATH

      - name: Configure native Windows build
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT"
          -DLINCUPL_BUILD_GUI=ON

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Stage installation before downloading device data
        run: cmake --install build --config Release --prefix "$PWD/package/stage"

      - name: Download and verify device data
        run: python wincupl-extract-data

      - name: Enable full regressions
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build -DLINCUPL_REQUIRE_TEST_DATA=ON
          cmake --build build --config Release --parallel 3

      - name: Run full regressions
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Package executables and runtime libraries
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m aqt install-src windows 6.8.3 --archives qtbase qttools qtsvg --outputdir "$env:RUNNER_TEMP/QtSources"
          ./cmake/package-windows.ps1

      - name: Test the packaged applications
        run: python tests/windows_package.py "$env:WINDOWS_ARCHIVE"

      - name: Upload binary archive
        uses: actions/upload-artifact@v7
        with:
          name: lincupl-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish tagged binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, regression, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v8
        with:
          pattern: lincupl-*
          path: dist
          merge-multiple: true

      - name: Verify archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/lincupl-*.tar.gz dist/lincupl-*.zip)
          if [[ ${#archives[@]} -ne 3 ]]; then
            echo "Expected Linux, macOS and Windows archives" >&2
            exit 1
          fi
          (cd dist && sha256sum lincupl-*.tar.gz lincupl-*.zip > SHA256SUMS)

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/lincupl-*.tar.gz
            dist/lincupl-*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
